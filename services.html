  <div id="video_area">
    <video id="video" poster="assets/movie/background.png" webkit-playsinline playsinline muted autoplay loop>
      <!-- 各種説明
          poster：動画ファイルが利用できない環境で代替表示される画像
          webkit-playsinline：iOS 9までのSafari用インライン再生指定
          playsinline：iOS 10以降のSafari用インライン再生指定
          muted：音声をミュートさせる
          autoplay：動画を自動再生させる
          loop：動画をループさせる
          controls：コントロールバーを表示する
      -->
    <source src="assets/movie/background.mp4" type="video/mp4">
    <source src="assets/movie/background.ogv" type="video/ogv">
